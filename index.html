<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Nexora AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg-main: #000000;
      --bg-surface: #121212;
      --bg-sidebar: #0f0f0f;
      --bg-input: #1e1e1e;
      --text-main: #ececec;
      --text-muted: #8e8e93;
      --accent-blue: #2563eb;
      --border-color: #27272a;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    /* সাইডবার (ChatGPT ড্রয়ার) */
    #sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: left 0.25s ease;
    }

    #sidebar.active { left: 0; }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
    }
    #overlay.active { display: block; }

    .sidebar-header {
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .menu-item:hover, .menu-item.active { background: var(--bg-input); }
    .menu-item svg { width: 18px; height: 18px; stroke: var(--text-muted); }

    .menu-section-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin: 16px 12px 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ea580c;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* মূল চ্যাট স্ক্রিন */
    #main-app {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      position: relative;
    }

    header {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    .header-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .header-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }

    /* মেসেজ স্ক্রিন */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #27272a;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      color: #ececec;
      border-bottom-left-radius: 4px;
    }

    /* কিবোর্ড-ফ্রেন্ডলি বটম বার (Image 2 স্টাইল) */
    #input-form {
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-main);
    }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #27272a;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border-radius: 24px;
      padding: 4px 12px;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      max-height: 100px;
      line-height: 1.35;
      padding: 6px 0;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- সাইডবার ড্রয়ার -->
  <div id="overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Nexora AI</h2>
      <button class="header-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="sidebar-menu">
      <div class="menu-item" onclick="newChat()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
        <span>New chat</span>
      </div>
      <div class="menu-item">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Images</span>
      </div>
      <div class="menu-item">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Library</span>
      </div>
      <div class="menu-item">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        <span>Projects</span>
      </div>
      <div class="menu-item">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
        <span>Scheduled</span>
      </div>
      <div class="menu-item">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span>Plugins</span>
      </div>

      <div class="menu-section-title">Recents</div>
      <div id="recent-list">
        <div class="menu-item"><span>স্বাগতম চ্যাট</span></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">HK</div>
        <span style="font-size: 0.9rem; font-weight: 500;">Halima</span>
      </div>
    </div>
  </aside>

  <!-- চ্যাট স্ক্রিন -->
  <main id="main-app">
    <header>
      <button class="header-btn" onclick="toggleSidebar()">
        <svg width="22" height="22" fill="none" stroke="#ececec" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="header-title">Nexora AI ▾</div>
      <button class="header-btn" onclick="newChat()">
        <svg width="20" height="20" fill="none" stroke="#ececec" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
      </button>
    </header>

    <div id="chat-container">
      <div class="msg bot">Hello! I am Nexora AI. Ask me anything in English or বাংলা!</div>
    </div>

    <!-- বটম ইনপুট বার -->
    <form id="input-form" onsubmit="handleSend(event)">
      <button type="button" class="action-btn" title="Add Attachments">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
      </button>

      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="Message Nexora AI..." oninput="autoResize(this)" required></textarea>
      </div>

      <button type="button" class="action-btn" id="micBtn" onclick="toggleSpeech()" title="Voice Input">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4m-4 0h8"/></svg>
      </button>

      <button type="submit" class="send-btn" id="sendBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5m-7 7l7-7 7 7"/></svg>
      </button>
    </form>
  </main>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function newChat() {
      document.getElementById('chat-container').innerHTML = '<div class="msg bot">Hello! What can I help with today?</div>';
      toggleSidebar();
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const container = document.getElementById('chat-container');
      const message = input.value.trim();

      if (!message) return;

      // ইউজার মেসেজ রেন্ডার
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = message;
      container.appendChild(userDiv);

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      container.scrollTop = container.scrollHeight;

      // বট লোডিং
      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      botDiv.innerText = 'Thinking...';
      container.appendChild(botDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        botDiv.innerText = data.reply || data.error || 'No response';
      } catch (err) {
        botDiv.innerText = 'Error: Failed to fetch response.';
      } finally {
        sendBtn.disabled = false;
        container.scrollTop = container.scrollHeight;
      }
    }

    // ভয়েস ইনপুট (Web Speech API)
    function toggleSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Voice input is not supported in this browser.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'bn-BD';
      recognition.start();
      recognition.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
      };
    }
  </script>
</body>
          </html>
