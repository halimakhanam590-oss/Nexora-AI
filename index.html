<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Nexora AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-main: #000000;
      --bg-surface: #121212;
      --bg-sidebar: #0f0f0f;
      --bg-input: #1e1e1e;
      --text-main: #ececec;
      --text-muted: #8e8e93;
      --accent-blue: #2563eb;
      --border-color: #27272a;
    }
    body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; }

    /* সাইডবার ড্রয়ার */
    #sidebar {
      position: fixed; top: 0; left: -290px; width: 290px; height: 100%;
      background: var(--bg-sidebar); border-right: 1px solid var(--border-color);
      z-index: 100; display: flex; flex-direction: column; transition: left 0.25s ease;
    }
    #sidebar.active { left: 0; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; }
    #overlay.active { display: block; }

    .sidebar-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .sidebar-menu { flex: 1; overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
    
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: 8px; color: var(--text-main); font-size: 0.95rem; cursor: pointer;
    }
    .menu-item:hover, .menu-item.active { background: var(--bg-input); }
    .menu-item svg { width: 18px; height: 18px; stroke: var(--text-muted); }
    .menu-section-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin: 16px 12px 6px; text-transform: uppercase; }

    .sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #ea580c; color: #fff; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; }

    /* মূল অ্যাপ */
    #main-app { flex: 1; display: flex; flex-direction: column; height: 100dvh; position: relative; }
    header { height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .header-btn { background: none; border: none; color: var(--text-main); cursor: pointer; display: grid; place-items: center; }
    .header-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; line-height: 1.45; font-size: 0.95rem; word-break: break-word; }
    .user { align-self: flex-end; background: #27272a; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; color: #ececec; border-bottom-left-radius: 4px; }
    .generated-img { width: 100%; max-width: 320px; border-radius: 12px; margin-top: 8px; border: 1px solid var(--border-color); }

    /* ইনপুট বার */
    #input-form { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; background: var(--bg-main); }
    .action-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #27272a; color: #fff; display: grid; place-items: center; cursor: pointer; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: var(--bg-input); border-radius: 24px; padding: 4px 12px; }
    textarea { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 0.95rem; resize: none; max-height: 100px; padding: 6px 0; }
    .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent-blue); color: #fff; display: grid; place-items: center; cursor: pointer; }
    .send-btn:disabled { opacity: 0.3; }

    /* পপআপ মডাল */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; place-items: center; padding: 20px; }
    .modal.active { display: grid; }
    .modal-box { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 360px; padding: 20px; }
    .modal-box h3 { font-size: 1.1rem; margin-bottom: 12px; }
    .modal-box p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }
    .modal-btn { width: 100%; padding: 10px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <!-- সাইডবার ড্রয়ার -->
  <div id="overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>Nexora AI</h2>
      <button class="header-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="sidebar-menu">
      <div class="menu-item" onclick="startNewChat()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
        <span>New chat</span>
      </div>
      <div class="menu-item" onclick="activateImageMode()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Images (AI Generate)</span>
      </div>
      <div class="menu-item" onclick="openModal('Library', 'আপনার বুকমার্ক করা উত্তর ও গুরুত্বপূর্ণ নোট এখানে সংরক্ষিত থাকবে।')">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 4.5A2.5 2.5 0 016.5 7H20v13H6.5A2.5 2.5 0 014 17.5V4.5z"/></svg>
        <span>Library</span>
      </div>
      <div class="menu-item" onclick="openModal('Projects', 'আপনার চলমান প্রজেক্ট বা ফাইলগুলো ম্যানেজ করার ওয়ার্কস্পেস।')">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        <span>Projects</span>
      </div>
      <div class="menu-item" onclick="scheduleTask()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
        <span>Scheduled (Reminder)</span>
      </div>
      <div class="menu-item" onclick="openModal('Plugins', 'Nexora Plugins: Web Browsing ও Data Analytics প্লাগইন চালু আছে।')">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span>Plugins</span>
      </div>

      <div class="menu-section-title">Recents</div>
      <div id="recent-list"></div>
    </div>

    <div class="sidebar-footer" onclick="openModal('User Profile', 'Profile: Halima\nAccount: Pro Active\nNexora Engine v2.0')">
      <div class="user-profile">
        <div class="avatar">HK</div>
        <span style="font-size: 0.9rem; font-weight: 500;">Halima</span>
      </div>
    </div>
  </aside>

  <!-- চ্যাট স্ক্রিন -->
  <main id="main-app">
    <header>
      <button class="header-btn" onclick="toggleSidebar()">
        <svg width="22" height="22" fill="none" stroke="#ececec" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="header-title" id="headerTitle">Nexora AI ▾</div>
      <button class="header-btn" onclick="startNewChat()">
        <svg width="20" height="20" fill="none" stroke="#ececec" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
      </button>
    </header>

    <div id="chat-container">
      <div class="msg bot">Hello! I am Nexora AI. Ask me anything in English or বাংলা!</div>
    </div>

    <!-- বটম ইনপুট বার -->
    <form id="input-form" onsubmit="handleSend(event)">
      <button type="button" class="action-btn" onclick="activateImageMode()" title="Create Image">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m-7-7h14"/></svg>
      </button>

      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="Message Nexora AI..." oninput="autoResize(this)" required></textarea>
      </div>

      <button type="button" class="action-btn" id="micBtn" onclick="toggleSpeech()" title="Voice Input">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4m-4 0h8"/></svg>
      </button>

      <button type="submit" class="send-btn" id="sendBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5m-7 7l7-7 7 7"/></svg>
      </button>
    </form>
  </main>

  <!-- পপআপ মডাল বক্স -->
  <div class="modal" id="infoModal">
    <div class="modal-box">
      <h3 id="modalTitle">Feature</h3>
      <p id="modalDesc">Details</p>
      <button class="modal-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    let isImageMode = false;
    let currentSessionId = Date.now().toString();

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function openModal(title, desc) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('infoModal').classList.add('active');
      toggleSidebar();
    }

    function closeModal() {
      document.getElementById('infoModal').classList.remove('active');
    }

    function scheduleTask() {
      const minutes = prompt("কত মিনিট পর রিমাইন্ডার পেতে চান?", "1");
      if (minutes && !isNaN(minutes)) {
        alert(`${minutes} মিনিটের জন্য রিমাইন্ডার সেট করা হয়েছে!`);
        setTimeout(() => {
          alert("⏰ Nexora AI Reminder: আপনার কাজের সময় হয়ে গেছে!");
        }, Number(minutes) * 60000);
      }
      toggleSidebar();
    }

    function activateImageMode() {
      isImageMode = true;
      document.getElementById('headerTitle').innerText = "Nexora Image AI 🎨";
      document.getElementById('userInput').placeholder = "বর্ণনা লিখুন (যেমন: A futuristic city)...";
      document.getElementById('userInput').focus();
      if (document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
    }

    function startNewChat() {
      isImageMode = false;
      document.getElementById('headerTitle').innerText = "Nexora AI ▾";
      document.getElementById('userInput').placeholder = "Message Nexora AI...";
      currentSessionId = Date.now().toString();
      document.getElementById('chat-container').innerHTML = '<div class="msg bot">Hello! What can I help with today?</div>';
      if (document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
    }

    // চ্যাট সংরক্ষণ (Recents)
    function saveChatHistory(title, userText, botReply, isImg = false) {
      let chats = JSON.parse(localStorage.getItem('nexora_recents') || '[]');
      let session = chats.find(c => c.id === currentSessionId);
      if (!session) {
        session = { id: currentSessionId, title: title.slice(0, 24), messages: [] };
        chats.unshift(session);
      }
      session.messages.push({ user: userText, bot: botReply, isImg });
      localStorage.setItem('nexora_recents', JSON.stringify(chats.slice(0, 15)));
      renderRecents();
    }

    function renderRecents() {
      const list = document.getElementById('recent-list');
      const chats = JSON.parse(localStorage.getItem('nexora_recents') || '[]');
      list.innerHTML = '';
      chats.forEach(c => {
        const item = document.createElement('div');
        item.className = 'menu-item';
        item.innerHTML = `<span>💬 ${c.title}</span>`;
        item.onclick = () => loadChatSession(c.id);
        list.appendChild(item);
      });
    }

    function loadChatSession(id) {
      const chats = JSON.parse(localStorage.getItem('nexora_recents') || '[]');
      const session = chats.find(c => c.id === id);
      if (!session) return;
      currentSessionId = session.id;
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      session.messages.forEach(m => {
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user';
        userDiv.innerText = m.user;
        container.appendChild(userDiv);

        const botDiv = document.createElement('div');
        botDiv.className = 'msg bot';
        if (m.isImg) {
          botDiv.innerHTML = `<img src="${m.bot}" class="generated-img" alt="Generated AI image" />`;
        } else {
          botDiv.innerText = m.bot;
        }
        container.appendChild(botDiv);
      });
      toggleSidebar();
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const container = document.getElementById('chat-container');
      const message = input.value.trim();
      if (!message) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = message;
      container.appendChild(userDiv);

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const botDiv = document.createElement('div');
      botDiv.className = 'msg bot';
      botDiv.innerText = isImageMode ? 'Generating Image...' : 'Thinking...';
      container.appendChild(botDiv);
      container.scrollTop = container.scrollHeight;

      if (isImageMode) {
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(message)}?width=768&height=768&nologo=true`;
        botDiv.innerHTML = `<img src="${imgUrl}" class="generated-img" alt="AI Image" onload="scrollChat()" onerror="this.src=''; this.innerText='Image generation failed.'" />`;
        saveChatHistory(message, message, imgUrl, true);
        sendBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        const replyText = data.reply || data.error || 'No response';
        botDiv.innerText = replyText;
        saveChatHistory(message, message, replyText, false);
      } catch (err) {
        botDiv.innerText = 'Error: Failed to fetch response.';
      } finally {
        sendBtn.disabled = false;
        container.scrollTop = container.scrollHeight;
      }
    }

    function scrollChat() {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    function toggleSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('ভয়েস ইনপুট এই ব্রাউজারে সাপোর্টেড নয়।');
      const rec = new SpeechRecognition();
      rec.lang = 'bn-BD';
      rec.start();
      rec.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; };
    }

    window.onload = renderRecents;
  </script>
</body>
</html>
